[project]
name = "agent-code"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "ikkihou", email = "oye20000101@gmail.com" }]
requires-python = ">=3.14"
dependencies = [
    "anthropic>=0.109.1",
    "click>=8.4.2",
    "dotenv>=0.9.9",
    "html2text>=2025.4.15",
    "httpx[socks]>=0.28.1",
    "pathspec>=1.1.1",
    "pyperclip>=1.11.0",
    "rich>=15.0.0",
    "textual>=8.2.8",
    "typer>=0.26.7",
]

[project.scripts]
agent-code = "agent_code.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_code"]

[tool.uv]
package = true

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["F401", "E402", "E501"]

[tool.ruff]
line-length = 100

[tool.ruff.format]
quote-style = "double"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.0",
    "ruff>=0.16.0",
    "ty>=0.0.107",
]

[tool.ty.environment]
# Same target as pyright: the repo's requires-python pin, not whatever interpreter
# ty happens to discover.
python-version = "3.14"

[tool.ty.src]
# Only first-party code: .venv, .agent/ and .bg/ stay out of the check.
include = ["agent_code", "tests"]
