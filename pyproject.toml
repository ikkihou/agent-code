[project]
name = "agent-code"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "ikkihou", email = "oye20000101@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.109.1",
    "click>=8.4.2",
    "dotenv>=0.9.9",
    "html2text>=2025.4.15",
    "httpx[socks]>=0.28.1",
    "pathspec>=1.1.1",
    "prompt-toolkit>=3.0.52",
    "rich>=15.0.0",
    "typer>=0.26.7",
]

[project.scripts]
agent-code = "agent_code.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_code"]

[tool.uv]
package = true

[tool.ruff.lint]
# ignore = ["F401", "E402"]

[dependency-groups]
dev = ["pytest>=9.1.0"]
